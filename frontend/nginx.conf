# Docker DNS: nginx ponovo trazi IP servisa (nema vise 502 nakon rebuilda backenda,
# i ne pada pri startu ako neki servis jos nije podignut).
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        set $backend_up http://backend:8081;
        proxy_pass $backend_up;
        proxy_set_header Host $host;
        # $remote_addr umjesto $proxy_add_x_forwarded_for: klijent ne moze podmetnuti lazni IP
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
    }

    location /ws/ {
        set $backend_up http://backend:8081;
        proxy_pass $backend_up;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 3600s;
    }

    location = /config.js {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
