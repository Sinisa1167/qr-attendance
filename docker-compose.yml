x-app-env: &app-env
  POSTGRES_HOST: postgres
  POSTGRES_DB: ${POSTGRES_DB:-qrattendance}
  POSTGRES_USER: ${POSTGRES_USER:-qruser}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qrpassword123}
  REDIS_HOST: redis
  KEYCLOAK_REALM: ${KEYCLOAK_REALM:-qr-attendance}
  KEYCLOAK_ISSUER_URI: http://${HOST_IP:-localhost}:8080/realms/${KEYCLOAK_REALM:-qr-attendance}
  QR_REFRESH_INTERVAL: ${QR_REFRESH_INTERVAL:-30000}
  QR_SECRET: ${QR_SECRET:-demo-qr-secret-promijeni-u-produkciji-0123456789abcdef}
  ATTENDANCE_THRESHOLD: ${ATTENDANCE_THRESHOLD:-70.0}
  STUDENT_EMAIL_DOMAIN: ${STUDENT_EMAIL_DOMAIN:-student.etf.unibl.org}
  EMPLOYEE_EMAIL_DOMAIN: ${EMPLOYEE_EMAIL_DOMAIN:-etf.unibl.org}

services:
  config-server:
    build: ./config-server
    container_name: qr-config-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8888"   # samo sa ovog racunara, nikad sa LAN
    environment:
      <<: *app-env
    networks:
      - qr-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8888/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  backend:
    build: ./backend
    container_name: qr-backend
    restart: unless-stopped
    depends_on:
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      <<: *app-env
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - qr-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  frontend:
    build: ./frontend
    container_name: qr-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    environment:
      KEYCLOAK_URL: http://${HOST_IP:-localhost}:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-qr-attendance}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-qr-attendance-app}
    networks:
      - qr-network

  postgres:
    image: postgres:16
    container_name: qr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-qrattendance}
      POSTGRES_USER: ${POSTGRES_USER:-qruser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qrpassword123}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - qr-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qruser} -d ${POSTGRES_DB:-qrattendance}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: qr-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - qr-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    container_name: qr-keycloak
    restart: unless-stopped
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin123}
      KC_DB: postgres
      # init-db.sql kreira bazu "keycloak", zato default ne treba mijenjati
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB:-keycloak}
      KC_DB_USERNAME: ${POSTGRES_USER:-qruser}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-qrpassword123}
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
    command: ["start-dev", "--import-realm"]
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "0.0.0.0:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - qr-network

networks:
  qr-network:
    driver: bridge

volumes:
  postgres_data:
