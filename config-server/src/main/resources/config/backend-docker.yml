server:
  port: 8081
  forward-headers-strategy: framework

spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:postgres}:5432/${POSTGRES_DB:qrattendance}
    username: ${POSTGRES_USER:qruser}
    password: ${POSTGRES_PASSWORD:qrpassword123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}
          jwk-set-uri: http://keycloak:8080/realms/qr-attendance/protocol/openid-connect/certs
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: 6379

eureka:
  client:
    service-url:
      defaultZone: http://config-server:8888/eureka
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  qr-secret: ${QR_SECRET}
  qr-refresh-interval: ${QR_REFRESH_INTERVAL}
  attendance:
    threshold: ${ATTENDANCE_THRESHOLD}
  student-email-domain: ${STUDENT_EMAIL_DOMAIN}
  employee-email-domain: ${EMPLOYEE_EMAIL_DOMAIN}
  group-rules:
    auditorne:
      - name: "Г1"
        ranges:
          - { from: 1101, to: 1159 }
